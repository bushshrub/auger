[package]
name = "auger-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait.workspace = true
auger-toolengine = { version = "0.1.0", path = "../auger-toolengine" }
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt", "macros"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
