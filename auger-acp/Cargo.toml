[package]
name = "auger-acp"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-server = { version = "0.1.0", path = "../agent-server" }
auger-core = { version = "0.1.0", path = "../auger-core" }
auger-driver = { version = "0.1.0", path = "../auger-driver" }
auger-policy = { version = "0.1.0", path = "../auger-policy" }
auger-toolengine = { version = "0.1.0", path = "../auger-toolengine" }
builtin-tools = { version = "0.1.0", path = "../builtin-tools" }
provider = { version = "0.1.0", path = "../provider" }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid.workspace = true

[dev-dependencies]
provider-dummy = { path = "../provider-dummy" }
