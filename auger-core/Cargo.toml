[package]
name = "auger-core"
version = "0.1.0"
edition = "2024"

[dependencies]
provider.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
either.workspace = true
uuid = { workspace = true, features = ["serde", "v4", "v7"]}
chrono = { version = "0.4.45", features = ["serde"] }
auger-driver.workspace = true
tokio-util.workspace = true
getset.workspace = true
derive_more = { workspace = true, features = ["from"] }
async-trait.workspace = true
auger-toolengine = { version = "0.1.0", path = "../auger-toolengine" }

[dev-dependencies]
async-trait.workspace = true
auger-driver.workspace = true
auger-toolengine = { path = "../auger-toolengine" }
builtin-tools = { path = "../builtin-tools" }
provider-dummy.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true
