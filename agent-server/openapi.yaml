openapi: 3.1.0
info:
  title: Auger Agent API
  version: 0.1.0
paths:
  /sessions:
    get:
      summary: List sessions
      responses:
        "200":
          description: Sessions, including archived sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
    post:
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateSessionResponse" }
  /sessions/{id}:
    delete:
      summary: Archive a session
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "204": { description: Session archived }
        "401": { description: Invalid write token }
        "404": { description: Session not found }
  /sessions/{id}/input:
    post:
      summary: Send a user message
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInputRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: Invalid write token }
        "404": { description: Session not found }
  /sessions/{id}/tool:
    post:
      summary: Approve or deny a tool call
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolDecisionRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: Invalid write token }
        "404": { description: Session not found }
  /sessions/{id}/interrupt:
    post:
      summary: Interrupt in-flight generation or tool execution
      description: >-
        Fire-and-forget; the outcome is observed on the event stream as an
        `interrupted` event (stream interruption) or `tool_call_error` events
        (cancelled tool calls). Ignored if the session is idle.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: Invalid write token }
        "404": { description: Session not found }
  /sessions/{id}/snapshot:
    get:
      summary: Get a session trace snapshot
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: >-
            Session trace snapshot as NDJSON: every record so far, in `seq`
            order, the same lines persisted to the session's JSONL file.
            Folding them restores the session.
          content:
            application/x-ndjson:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TraceRecord" }
        "401": { description: Invalid read token }
        "404": { description: Session not found }
  /sessions/{id}/events:
    get:
      summary: Subscribe to session events
      description: Each SSE data field contains one JSON object matching SessionEvent.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/SessionEvent" }
        "401": { description: Invalid read token }
        "404": { description: Session not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Ok:
      description: Command accepted
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties: { status: { const: ok } }
  schemas:
    CreateSessionRequest:
      type: object
      properties: { model: { type: [string, "null"] } }
    CreateSessionResponse:
      type: object
      required: [session_id, context_window, tokens]
      properties:
        session_id: { type: string, format: uuid }
        context_window: { type: integer }
        tokens:
          type: object
          required: [read, write]
          properties:
            read: { type: string, format: uuid }
            write: { type: string, format: uuid }
    UserInputRequest:
      type: object
      required: [input]
      properties: { input: { type: string } }
    ToolDecisionRequest:
      type: object
      required: [tool_call_id, approved]
      properties:
        tool_call_id: { type: string }
        approved: { type: boolean }
        message: { type: [string, "null"] }
    ToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id: { type: string }
        name: { type: string }
        arguments: { type: string }
    Session:
      type: object
      required: [session_id, model, created_at, archived, context_window, tokens]
      properties:
        session_id: { type: string, format: uuid }
        model: { type: string }
        created_at: { type: integer }
        archived: { type: boolean }
        context_window: { type: integer }
        tokens:
          type: object
          properties:
            read: { type: string, format: uuid }
            write: { type: string, format: uuid }
    ModelInfo:
      type: object
      required: [provider, id]
      properties:
        provider: { type: string }
        id: { type: string }
    ToolData:
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type: { const: text }
            text: { type: string }
    # Externally tagged, as serialized by auger-core: the payload of a tool
    # call result on the event stream, e.g.
    #   {"success": {"content": [{"text": {"text": "..."}}]}}
    ToolOutcome:
      oneOf:
        - type: object
          required: [success]
          properties:
            success:
              type: object
              required: [content]
              properties:
                content: { type: array, items: { $ref: "#/components/schemas/EventToolData" } }
        - type: object
          required: [error]
          properties:
            error:
              type: object
              required: [error]
              properties:
                error: { type: array, items: { $ref: "#/components/schemas/EventToolData" } }
        - type: object
          required: [denied]
          properties:
            denied:
              type: object
              properties:
                reason: { type: [string, "null"] }
        - const: interrupted
    EventToolData:
      type: object
      required: [text]
      properties:
        text:
          type: object
          required: [text]
          properties:
            text: { type: string }
    TraceRecord:
      description: >-
        One line of a trace. `seq` starts at 0 with no gaps. `data` depends on
        `type`; enum payloads are externally tagged and snake_case.
      type: object
      required: [seq, ts, type, data]
      properties:
        seq: { type: integer, minimum: 0 }
        ts: { type: string, format: date-time }
        type:
          type: string
          enum: [session, turns, stream, tool]
          description: >-
            `session`: always first; session data, `version` (2) and the
            `system_prompt`. `turns`: how the conversation changed, one of
            `push_turn` (an `input` turn of entries or an `output` turn of
            blocks), `push_entry` (the last input turn gained an entry) or
            `truncate` (`len` turns kept). `stream`: `started`, `completed`
            (usage, stop_reason), `interrupted` or `failed` (with any
            `partial` blocks not yet in the turns). `tool`: `decided`,
            `started` (written before the call runs), `finished` (the
            outcome) or `cwd_changed`.
        data: {}
    SessionEvent:
      oneOf:
        - type: object
          required: [type, text]
          properties: { type: { const: text_delta }, text: { type: string } }
        - type: object
          required: [type, text]
          properties: { type: { const: reasoning_delta }, text: { type: string } }
        - allOf:
            - { $ref: "#/components/schemas/ToolCall" }
            - type: object
              properties: { type: { enum: [tool_call, tool_call_complete] } }
        - type: object
          required: [type, tool_calls]
          properties:
            type: { const: tool_consent_required }
            tool_calls: { type: array, items: { $ref: "#/components/schemas/ToolCall" } }
        - type: object
          description: >-
            Live only, not in the snapshot. Sent once when a restored session
            starts: tools it called before are not offered now.
          required: [type, names]
          properties:
            type: { const: tools_missing }
            names: { type: array, items: { type: string } }
        - type: object
          description: >-
            The approval policy settled a call without asking the user. An
            allowed call runs at once; a denied call is followed by its
            tool_call_result. Calls the policy cannot settle appear in
            tool_consent_required instead.
          required: [type, id, decision, node]
          properties:
            type: { const: tool_policy_decision }
            id: { type: string }
            decision: { enum: [allowed, denied] }
            node: { type: string, description: Name of the policy node that decided. }
            reason: { type: string, description: Present when denied. }
        - type: object
          required: [type, id, result]
          properties:
            type: { const: tool_call_result }
            id: { type: string }
            result:
              type: object
              required: [tool_call_id, outcome]
              properties:
                tool_call_id: { type: string }
                outcome: { $ref: "#/components/schemas/ToolOutcome" }
        - type: object
          required: [type, id, error]
          properties:
            type: { const: tool_call_error }
            id: { type: string }
            error: { type: string }
        - type: object
          required: [type]
          properties: { type: { const: interrupted } }
        - type: object
          required: [type]
          properties:
            type: { const: done }
            usage: { type: [object, "null"] }
            stop_reason: { type: [string, "null"] }
        - type: object
          required: [type]
          properties: { type: { const: closed } }
